<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LELSUB 후원 Tool</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262a33;
    --text: #e6e8eb;
    --sub: #9aa1ac;
    --accent: #7dd3fc;
    --accent-dim: #38506b;
    --danger: #f87171;
    --accent2: #fbbf24;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      color-scheme: light;
      --accent2: #d97706;
      --bg: #f5f6f8;
      --panel: #ffffff;
      --border: #e2e4e9;
      --text: #1a1c20;
      --sub: #6b7280;
      --accent: #0ea5e9;
      --accent-dim: #bae6fd;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --accent2: #fbbf24;
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262a33;
    --text: #e6e8eb;
    --sub: #9aa1ac;
    --accent: #7dd3fc;
    --accent-dim: #38506b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Pretendard, sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px 16px 60px;
  }
  .wrap {
    width: 100%;
    max-width: 480px;
  }
  h1 {
    font-size: 17px;
    font-weight: 600;
    margin: 0 0 4px;
    color: var(--text);
  }
  .sub {
    font-size: 12.5px;
    color: var(--sub);
    margin: 0 0 20px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 16px;
  }
  .card h2 {
    font-size: 13px;
    font-weight: 600;
    margin: 0 0 14px;
    color: var(--accent);
    letter-spacing: 0.02em;
  }
  label {
    display: block;
    font-size: 12px;
    color: var(--sub);
    margin-bottom: 6px;
  }
  input[type="datetime-local"],
  input[type="date"],
  input[type="text"] {
    width: 100%;
    padding: 10px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
  }
  input:focus { outline: none; border-color: var(--accent); }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  button {
    font-family: inherit;
    font-size: 13px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    padding: 9px 12px;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
    -webkit-tap-highlight-color: transparent;
    outline: none;
  }
  button:hover { border-color: var(--accent); }
  button:active { filter: brightness(0.88); }
  button:focus, button:focus-visible { outline: none; border-color: var(--accent); }
  .btn-primary {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--text);
    flex: 1;
  }
  .result-box {
    margin-top: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .result-value {
    flex: 1;
    padding: 10px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 0.02em;
    word-break: break-all;
  }
  .copy-btn { white-space: nowrap; }
  .copy-btn.copied { border-color: #4ade80; color: #4ade80; }
  .error { color: var(--danger); font-size: 12px; margin-top: 6px; min-height: 14px; }
  .hint { font-size: 11px; color: var(--sub); margin-top: 8px; line-height: 1.5; }

  /* 섹션 구분: 후원 시(파랑) / 만료 시(주황) */
  .section-title { margin: 26px 0 12px; padding: 2px 0 2px 10px; border-left: 3px solid var(--sec-color); }
  .section-title .st-main { font-size: 14px; font-weight: 700; color: var(--sec-color); }
  .section-title .st-sub { font-size: 11.5px; color: var(--sub); margin-top: 2px; }
  .sec-donate { --sec-color: var(--accent); }
  .sec-expire { --sec-color: var(--accent2); }
  .card-donate { border-left: 3px solid var(--accent); }
  .card-expire { border-left: 3px solid var(--accent2); }
  .card-expire h2 { color: var(--accent2); }
  /* 만료 등급 카드: 아래 카드와 붙어 보이게 */
  .card-attach { margin-bottom: 4px; padding: 14px 18px; border-bottom-left-radius: 6px; border-bottom-right-radius: 6px; }
  .card-attach + .card { border-top-left-radius: 6px; border-top-right-radius: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🌳 LELSUB 후원 Tool</h1>
  <p class="sub">후원 패스 만료시각 계산, LuckPerms 명령어, 안내 메시지까지 한 번에.</p>

  <div class="card" style="padding: 12px 18px; display:flex; justify-content:space-between; align-items:center;">
    <span style="font-size:12px; color: var(--sub);">현재 기준 시각 (KST)</span>
    <span id="now-clock" style="font-size:13px; font-weight:600; color: var(--text);">-</span>
  </div>

  <div class="section-title sec-donate">
    <div class="st-main">💳 후원 받았을 때</div>
    <div class="st-sub">기간 계산 · 권한 명령어 · 후원 완료 메시지</div>
  </div>

  <div class="card card-donate">
    <h2>만료 시각 설정</h2>
    <div class="row">
      <button id="mode-now" class="btn-primary" style="flex:1;">지금 기준</button>
      <button id="mode-custom" style="flex:1;">특정 날짜 기준</button>
    </div>

    <div id="custom-date-row" style="display:none; margin-top: 10px;">
      <input type="date" id="custom-start-input" lang="en-GB">
    </div>

    <div style="margin-top: 14px;">
      <label for="duration-input">기간 (일)</label>
      <div class="row" style="margin-top: 0;">
        <input type="number" id="duration-input" min="1" value="30" inputmode="numeric" style="flex:1; min-width:0; padding:10px 12px; background: var(--bg); border:1px solid var(--border); border-radius:8px; color: var(--text); font-size:14px; font-family:inherit;">
        <button class="dur-chip" data-days="30">30</button>
        <button class="dur-chip" data-days="60">60</button>
        <button class="dur-chip" data-days="90">90</button>
      </div>
    </div>

    <div style="margin-top: 14px;">
      <label for="dt-input">만료 시각 (KST, 직접 수정 가능)</label>
      <input type="datetime-local" id="dt-input" step="1" lang="en-GB">
    </div>

    <div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border);">
      <div style="font-size:13px; font-weight:600; color: var(--accent); margin-bottom: 10px;">LuckPerms 명령어</div>
      <label for="nickname-input">닉네임</label>
      <input type="text" id="nickname-input" placeholder="닉네임 입력">
      <div class="row" style="margin-top: 10px;">
        <div style="flex:1;">
          <label for="group-select" style="margin-bottom:6px;">그룹</label>
          <select id="group-select" style="width:100%; padding:10px 12px; background: var(--bg); border:1px solid var(--border); border-radius:8px; color: var(--text); font-size:14px; font-family:inherit;">
            <option value="expert">expert</option>
            <option value="elite">elite</option>
            <option value="prime">prime</option>
            <option value="eternal">eternal</option>
          </select>
        </div>
      </div>
      <div class="result-box" style="margin-top: 12px;">
        <div class="result-value" id="cmd-result" style="font-size:13px; color: var(--text); font-family: monospace;">-</div>
        <button class="copy-btn" id="copy-cmd">복사</button>
      </div>
      <div class="hint">위 명령어를 콘솔에 붙여넣으면 돼 (앞에 / 없음)</div>
    </div>
  </div>

  <div class="card card-donate">
    <h2>후원 완료 메시지</h2>
    <label for="msg-result">복사용 안내 메시지</label>
    <textarea id="msg-result" readonly rows="9" style="width:100%; padding:10px 12px; background: var(--bg); border:1px solid var(--border); border-radius:8px; color: var(--text); font-size:13px; font-family: monospace; resize: vertical; line-height:1.6;"></textarea>
    <div class="row" style="margin-top:10px;">
      <button class="btn-primary" id="copy-msg" style="flex:1;">메시지 복사</button>
    </div>
  </div>

  <div class="section-title sec-expire">
    <div class="st-main">⏰ 패스가 만료될 때</div>
    <div class="st-sub">만료 예정 안내 · 만료 명령어</div>
  </div>

  <div class="card card-expire card-attach">
    <h2>만료 등급</h2>
    <label for="expire-group-select">등급 (아래 만료 예정 안내 메시지 · 만료 명령어에 적용)</label>
    <select id="expire-group-select" style="width:100%; padding:10px 12px; background: var(--bg); border:1px solid var(--border); border-radius:8px; color: var(--text); font-size:14px; font-family:inherit;">
      <option value="user">user</option>
      <option value="expert">expert</option>
      <option value="elite">elite</option>
      <option value="prime">prime</option>
      <option value="eternal">eternal</option>
    </select>
  </div>

  <div class="card card-expire">
    <h2>만료 예정 안내 메시지</h2>
    <label for="days-left-input">남은 일수</label>
    <input type="number" id="days-left-input" min="0" value="1" style="width:100%; padding:10px 12px; background: var(--bg); border:1px solid var(--border); border-radius:8px; color: var(--text); font-size:14px; font-family:inherit;">
    <textarea id="expiry-msg-result" readonly rows="7" style="margin-top:12px; width:100%; padding:10px 12px; background: var(--bg); border:1px solid var(--border); border-radius:8px; color: var(--text); font-size:13px; font-family: monospace; resize: vertical; line-height:1.6;"></textarea>
    <div class="row" style="margin-top:10px;">
      <button class="btn-primary" id="copy-expiry-msg" style="flex:1;">메시지 복사</button>
    </div>
  </div>

  <div class="card card-expire">
    <h2>만료 명령어</h2>
    <div class="result-box" style="margin-top: 0;">
      <div class="result-value" id="expire-scb-result" style="font-size:13px; color: var(--text); font-family: monospace;">-</div>
      <button class="copy-btn" id="copy-expire-scb">복사</button>
    </div>
    <div class="result-box" style="margin-top: 10px;">
      <div class="result-value" id="expire-home-result" style="font-size:13px; color: var(--text); font-family: monospace;">-</div>
      <button class="copy-btn" id="copy-expire-home">복사</button>
    </div>
  </div>

</div>

<script>
  const dtInput = document.getElementById('dt-input');
  const durationInput = document.getElementById('duration-input');
  let currentEpoch = null; // dt-input 값을 KST로 해석해 계산한 Unix timestamp (초)
  const nicknameInput = document.getElementById('nickname-input');
  const groupSelect = document.getElementById('group-select');
  const cmdResult = document.getElementById('cmd-result');
  const msgResult = document.getElementById('msg-result');
  const daysLeftInput = document.getElementById('days-left-input');
  const expiryMsgResult = document.getElementById('expiry-msg-result');

  const KST_OFFSET_MIN = 9 * 60;
  let passStartDate = null; // {y, mo, da} in KST — the start date last used for the duration calculation

  function pad(n) { return String(n).padStart(2, '0'); }

  function getTodayKST() {
    const d = new Date();
    const kst = new Date(d.getTime() + (KST_OFFSET_MIN + d.getTimezoneOffset()) * 60000);
    return { y: kst.getFullYear(), mo: kst.getMonth() + 1, da: kst.getDate(),
              h: kst.getHours(), mi: kst.getMinutes(), se: kst.getSeconds() };
  }

  // Pure calendar-date arithmetic (no timezone conversion needed — a KST calendar
  // date plus N days is still a KST calendar date).
  function addDays(y, mo, da, n) {
    const d = new Date(Date.UTC(y, mo - 1, da));
    d.setUTCDate(d.getUTCDate() + n);
    return { y: d.getUTCFullYear(), mo: d.getUTCMonth() + 1, da: d.getUTCDate() };
  }

  function getDurationDays() {
    const n = parseInt(durationInput.value, 10);
    return (n && n >= 1) ? n : null;
  }

  function applyStartDate(y, mo, da) {
    passStartDate = { y, mo, da };
    const days = getDurationDays() || 30;
    // 시작일을 1일차로 세므로 만료는 시작일 + (기간 - 1)일 23:59:59
    const expiry = addDays(y, mo, da, days - 1);
    dtInput.value = `${expiry.y}-${pad(expiry.mo)}-${pad(expiry.da)}T23:59:59`;
    updateEpochFromInput();
  }

  function updateEpochFromInput() {
    if (!dtInput.value) { currentEpoch = null; updateCommand(); return; }
    const [datePart, timePart] = dtInput.value.split('T');
    const [y, mo, da] = datePart.split('-').map(Number);
    const [h, mi, se] = (timePart || '00:00:00').split(':').map(Number);
    // Treat the input as KST wall-clock, convert to UTC epoch
    const utcMs = Date.UTC(y, mo - 1, da, h, mi, se || 0) - KST_OFFSET_MIN * 60000;
    currentEpoch = Math.floor(utcMs / 1000);
    updateCommand();
  }

  const PASS_PRICE = { expert: 3900, elite: 7900, prime: 15900, eternal: 31900 };

  function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function formatWon(n) { return n.toLocaleString('ko-KR'); }

  function updateCommand() {
    const nick = nicknameInput.value.trim() || '닉네임';
    const group = groupSelect.value;
    if (currentEpoch === null) { cmdResult.textContent = '-'; } else {
      cmdResult.textContent = `lp user ${nick} parent addtemp ${group} ${currentEpoch} replace`;
    }
    updateMessage();
  }

  function updateMessage() {
    if (!dtInput.value) { msgResult.value = '-'; return; }
    const nick = nicknameInput.value.trim() || '닉네임';
    const group = groupSelect.value;
    const groupCap = capitalize(group);
    const price = PASS_PRICE[group];
    const durDays = getDurationDays() || 30;

    // Start date: the date last used for a 30-day calculation (defaults to today)
    const sd = passStartDate || (() => { const t = getTodayKST(); return { y: t.y, mo: t.mo, da: t.da }; })();
    const startDate = `${sd.y}. ${pad(sd.mo)}. ${pad(sd.da)}.`;

    // End date: from the KST wall-clock value already in dt-input
    const [datePart] = dtInput.value.split('T');
    const [ey, em, ed] = datePart.split('-');
    const endDate = `${ey}. ${em}. ${ed}.`;

    msgResult.value =
`## [${groupCap} Pass] 후원 완료 ✅
> 서버에 후원해 주셔서 감사합니다. 

닉네임: ${nick}
패스 기간: ${startDate} ~ ${endDate}

내용: ${groupCap} Pass ${durDays}일 | 금액: ₩${formatWon(price)}

후원하신 패스는 **서버 재접속 시** 사용 가능합니다.
-# 🌳 Lelsub.kr | SEASON4`;

    updateExpiryMessage();
  }

  function updateExpiryMessage() {
    if (!dtInput.value) { expiryMsgResult.value = '-'; return; }
    const group = expireGroupSelect.value;
    const groupCap = capitalize(group);
    const [datePart] = dtInput.value.split('T');
    const [ey, em, ed] = datePart.split('-');
    const endDate = `${ey}. ${em}. ${ed}.`;
    const days = daysLeftInput.value === '' ? 0 : parseInt(daysLeftInput.value, 10);

    expiryMsgResult.value =
`## [${groupCap} Pass] 안내
> 📅 만료 예정일: ${endDate}

- [${groupCap} Pass] 종료일이 **${days}일** 남았습니다.
-# 🌳 Lelsub.kr | SEASON4
-# @everyone`;
  }

  function copyText(text, btn) {
    if (!text || text === '-') return;
    navigator.clipboard.writeText(text).then(() => {
      const original = btn.textContent;
      btn.textContent = '완료';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = original; btn.classList.remove('copied'); }, 1200);
    }).catch(() => {
      btn.textContent = '실패';
      setTimeout(() => { btn.textContent = '복사'; }, 1200);
    });
  }

  function updateNowClock() {
    const d = new Date();
    const kst = new Date(d.getTime() + (KST_OFFSET_MIN + d.getTimezoneOffset()) * 60000);
    const dayNames = ['일','월','화','수','목','금','토'];
    const str = `${kst.getFullYear()}-${pad(kst.getMonth()+1)}-${pad(kst.getDate())} ${pad(kst.getHours())}:${pad(kst.getMinutes())}:${pad(kst.getSeconds())} (${dayNames[kst.getDay()]})`;
    document.getElementById('now-clock').textContent = str;
  }

  dtInput.addEventListener('input', updateEpochFromInput);
  nicknameInput.addEventListener('input', updateCommand);
  groupSelect.addEventListener('change', updateCommand);

  const modeNowBtn = document.getElementById('mode-now');
  const modeCustomBtn = document.getElementById('mode-custom');
  const customDateRow = document.getElementById('custom-date-row');
  const customStartInput = document.getElementById('custom-start-input');

  function setMode(mode) {
    if (mode === 'now') {
      modeNowBtn.classList.add('btn-primary');
      modeCustomBtn.classList.remove('btn-primary');
      customDateRow.style.display = 'none';
      const t = getTodayKST();
      applyStartDate(t.y, t.mo, t.da);
    } else {
      modeNowBtn.classList.remove('btn-primary');
      modeCustomBtn.classList.add('btn-primary');
      customDateRow.style.display = 'block';
      const [y, mo, da] = customStartInput.value.split('-').map(Number);
      applyStartDate(y, mo, da);
    }
  }

  modeNowBtn.addEventListener('click', () => setMode('now'));
  modeCustomBtn.addEventListener('click', () => setMode('custom'));
  customStartInput.addEventListener('change', () => {
    const [y, mo, da] = customStartInput.value.split('-').map(Number);
    applyStartDate(y, mo, da);
  });

  function reapplyDuration() {
    const sd = passStartDate || (() => { const t = getTodayKST(); return { y: t.y, mo: t.mo, da: t.da }; })();
    applyStartDate(sd.y, sd.mo, sd.da);
  }
  durationInput.addEventListener('input', () => { if (getDurationDays()) reapplyDuration(); });
  document.querySelectorAll('.dur-chip').forEach((btn) => {
    btn.addEventListener('click', () => {
      durationInput.value = btn.dataset.days;
      reapplyDuration();
    });
  });

  document.getElementById('copy-cmd').addEventListener('click', (e) => copyText(cmdResult.textContent, e.target));
  document.getElementById('copy-msg').addEventListener('click', (e) => copyText(msgResult.value, e.target));
  daysLeftInput.addEventListener('input', updateExpiryMessage);
  document.getElementById('copy-expiry-msg').addEventListener('click', (e) => copyText(expiryMsgResult.value, e.target));

  // 만료 명령어: 등급별 수치 (user, expert, elite, prime, eternal 순서)
  const EXPIRE_VALUES = {
    user:    { scb: 49,    home: 1 },
    expert:  { scb: 2000,  home: 2 },
    elite:   { scb: 7000,  home: 3 },
    prime:   { scb: 15000, home: 4 },
    eternal: { scb: 40000, home: 6 }
  };
  const expireGroupSelect = document.getElementById('expire-group-select');
  const expireScbResult = document.getElementById('expire-scb-result');
  const expireHomeResult = document.getElementById('expire-home-result');

  function updateExpireCommands() {
    const v = EXPIRE_VALUES[expireGroupSelect.value];
    expireScbResult.textContent = `scb ${v.scb}`;
    expireHomeResult.textContent = `trimhomeadmin ${v.home}`;
  }

  expireGroupSelect.addEventListener('change', () => { updateExpireCommands(); updateExpiryMessage(); });
  document.getElementById('copy-expire-scb').addEventListener('click', (e) => copyText(expireScbResult.textContent, e.target));
  document.getElementById('copy-expire-home').addEventListener('click', (e) => copyText(expireHomeResult.textContent, e.target));
  updateExpireCommands();

  // Init: default to "지금 기준" 30-day plan expiry
  const initToday = getTodayKST();
  customStartInput.value = `${initToday.y}-${pad(initToday.mo)}-${pad(initToday.da)}`;
  setMode('now');
  updateNowClock();
  setInterval(updateNowClock, 1000);
</script>
</body>
</html>
